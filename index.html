<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SANGUINAL - Official Site</title>
    <style>
        /* Stile Generale della Pagina */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Arial Black', sans-serif;
        }

        body {
            background-color: #080000;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* Canvas per l'effetto del sangue che cade */
        #bloodCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        /* Contenitore Principale */
        .container {
            position: relative;
            z-index: 10;
            text-align: center;
            background: rgba(15, 0, 0, 0.85);
            padding: 40px 30px;
            border-radius: 15px;
            border: 2px solid #8b0000;
            box-shadow: 0 0 30px rgba(139, 0, 0, 0.6);
            max-width: 90%;
            width: 400px;
        }

        /* Titolo Gioco */
        h1 {
            font-size: 3rem;
            color: #ff0000;
            text-transform: uppercase;
            letter-spacing: 4px;
            text-shadow: 0 0 10px #ff0000, 0 0 20px #8b0000;
            margin-bottom: 30px;
        }

        /* Menu Pulsanti */
        .button-group {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .btn {
            background: linear-gradient(180deg, #4a0000, #1a0000);
            color: #ffffff;
            border: 2px solid #ff0000;
            padding: 15px 20px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            text-transform: uppercase;
            text-decoration: none; /* Rimuove la sottolineatura dal link */
        }

        .btn:hover {
            background: #ff0000;
            color: #000000;
            box-shadow: 0 0 15px #ff0000;
            transform: scale(1.05);
        }

        /* Icona Discord */
        .discord-icon {
            width: 24px;
            height: 24px;
            fill: currentColor;
        }

        /* Box Informazioni (Popup/Messaggio) */
        .info-box {
            margin-top: 25px;
            padding: 15px;
            background: rgba(139, 0, 0, 0.2);
            border: 1px solid #ff0000;
            border-radius: 8px;
            color: #ffcccc;
            font-size: 1rem;
            display: none;
            animation: fadeIn 0.4s ease-in-out forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <!-- Sfondo Sangue Animato -->
    <canvas id="bloodCanvas"></canvas>

    <!-- Contenuto della pagina -->
    <div class="container">
        <h1>SANGUINAL</h1>

        <div class="button-group">
            <!-- Tasto 1: Gioco -->
            <button class="btn" onclick="mostraInfo()">
                🎮 GIOCO
            </button>

            <!-- Tasto 2: Link Diretto al Server Discord -->
            <a href="https://discord.gg/EeuvcDmbUd" target="_blank" class="btn">
                <svg class="discord-icon" viewBox="0 0 127.14 96.36">
                    <path d="M107.7,8.07A105.15,105.15,0,0,0,81.47,0a72.06,72.06,0,0,0-3.36,6.83A97.68,97.68,0,0,0,49,6.83,72.37,72.37,0,0,0,45.64,0,105.89,105.89,0,0,0,19.39,8.09C2.79,32.65-1.71,56.6.54,80.21A105.73,105.73,0,0,0,32.71,96.36,77.7,77.7,0,0,0,39.6,85.25a68.42,68.42,0,0,1-10.85-5.18c.91-.66,1.8-1.34,2.66-2a75.57,75.57,0,0,0,64.32,0c.87.71,1.76,1.39,2.66,2a68.68,68.68,0,0,1-10.87,5.19,77,77,0,0,0,6.89,11.1,105.25,105.25,0,0,0,32.19-16.14c2.64-27.38-4.51-51.11-18.9-72.15ZM42.45,65.69C36.18,65.69,31,60,31,53s5.18-12.7,11.45-12.7c6.33,0,11.5,5.77,11.39,12.7C53.84,60,48.78,65.69,42.45,65.69Zm42.24,0C78.41,65.69,73.25,60,73.25,53s5.16-12.7,11.44-12.7c6.34,0,11.5,5.77,11.39,12.7C96.08,60,91,65.69,84.69,65.69Z"/>
                </svg>
                SERVER DISCORD
            </a>
        </div>

        <!-- Messaggio che appare al click su GIOCO -->
        <div id="infoBox" class="info-box"></div>
    </div>

    <!-- Script per la gestione del click e l'effetto sangue -->
    <script>
        function mostraInfo() {
            const infoBox = document.getElementById('infoBox');
            infoBox.style.display = 'block';
            infoBox.innerHTML = "⚠️ <strong>IL GIOCO NON È ANCORA DISPONIBILE!</strong><br>Uscirà il <strong>7 Novembre 2026</strong>.";
        }

        // --- EFFETTO GOCCE DI SANGUE ANIMATE ---
        const canvas = document.getElementById('bloodCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        const drops = [];
        const numDrops = 45;

        for (let i = 0; i < numDrops; i++) {
            drops.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                length: Math.random() * 20 + 10,
                speed: Math.random() * 4 + 2,
                width: Math.random() * 3 + 1
            });
        }

        function drawBlood() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            for (let i = 0; i < drops.length; i++) {
                let d = drops[i];

                ctx.beginPath();
                ctx.rect(d.x, d.y, d.width, d.length);
                ctx.fillStyle = "rgba(180, 0, 0, 0.7)";
                ctx.fill();

                d.y += d.speed;

                if (d.y > canvas.height) {
                    d.y = -d.length;
                    d.x = Math.random() * canvas.width;
                }
            }
            requestAnimationFrame(drawBlood);
        }

        drawBlood();
    </script>
</body>
</html>
